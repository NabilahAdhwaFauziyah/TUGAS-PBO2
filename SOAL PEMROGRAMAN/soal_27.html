<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Soal 27 - Tahun Kabisat dengan Angka Terakhir 6</title>
</head>
<body>
    <h3>Soal 27 - Tahun Kabisat dengan Angka Terakhir 6</h3>
    <p>Tahun awal: <input id="awal" type="number"></p><p>Tahun akhir: <input id="akhir" type="number"></p>
    <p><button onclick="proses()">Proses</button></p>
    <pre id="hasil"></pre>
    <script>
    function proses() {
        let awal = Number(document.getElementById("awal").value);
let akhir = Number(document.getElementById("akhir").value);
let hasil = "";
for (let tahun = awal; tahun <= akhir; tahun++) {
if (tahun % 10 === 6 && (tahun % 400 === 0 || (tahun % 4 === 0 && tahun % 100 !== 0))) hasil += tahun + " ";
}
document.getElementById("hasil").textContent = hasil;
    }
    </script>
</body>
</html>
