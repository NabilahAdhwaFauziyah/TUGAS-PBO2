<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Soal 50 - Jumlah Total Bilangan Prima</title>
</head>
<body>
    <h3>Soal 50 - Jumlah Total Bilangan Prima</h3>
    <p>n awal: <input id="awal" type="number"></p><p>n akhir: <input id="akhir" type="number"></p>
    <p><button onclick="proses()">Proses</button></p>
    <pre id="hasil"></pre>
    <script>
    function proses() {
        function prima(n) { if (n < 2) return false; for (let i = 2; i * i <= n; i++) if (n % i === 0) return false; return true; }
let awal = Number(document.getElementById("awal").value), akhir = Number(document.getElementById("akhir").value), hasil = 0;
for (let n = awal; n <= akhir; n++) if (prima(n)) hasil++;
document.getElementById("hasil").textContent = hasil;
    }
    </script>
</body>
</html>
