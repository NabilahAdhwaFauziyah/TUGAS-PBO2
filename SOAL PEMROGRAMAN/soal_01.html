<!DOCTYPE html>
<html>
<head>
    <title>Soal 1</title>
</head>
<body>
    <h3>Soal 1 - Membalik Kalimat</h3>

    <p>
        <input id="kalimat" type="text">
    </p>

    <p>
        <button onclick="proses()">Proses</button>
    </p>

    <pre id="hasil"></pre>

    <script>
        function proses() {
            let kalimat = document.getElementById("kalimat").value;
            let hasil = "";

            for (let i = kalimat.length - 1; i >= 0; i--) {
                hasil += kalimat[i];
            }

            document.getElementById("hasil").textContent = hasil;
        }
    </script>
</body>
</html>
