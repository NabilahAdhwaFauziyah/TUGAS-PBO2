<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Soal 21 - Pangkat Dua</title>
</head>
<body>
    <h3>Soal 21 - Pangkat Dua</h3>
    <p>Jumlah angka: <input id="jumlah" type="number" value="10"></p>
    <p><button onclick="proses()">Proses</button></p>
    <pre id="hasil"></pre>
    <script>
    function proses() {
        let n = 1;
let jumlah = Number(document.getElementById("jumlah").value);
let hasil = "";
for (let i = 0; i < jumlah; i++) {{ hasil += n + " "; n *= 2; }}
document.getElementById("hasil").textContent = hasil;
    }
    </script>
</body>
</html>
